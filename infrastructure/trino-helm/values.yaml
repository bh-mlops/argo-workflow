catalogs:
  iceberg: |-
    connector.name=iceberg
    # Choose your Iceberg catalog type (e.g., nessie, rest, hive, glue)
    connector.name=iceberg
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://nessie.nessie-ns.svc.cluster.local:19120/api/v1
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3a://iceberg/

    # MinIO S3 Connection Settings
    fs.native-s3.enabled=true
    s3.endpoint=http://minio:9001
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=<access key>
    s3.aws-secret-key=<secert key>