apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: unpack-pipeline-
spec:
  entrypoint: main
  templates:
    - name: main

      steps:
      #   # when a new the file from the bucket comes in( determine resource resource type from event call ), workflow determines if the file is either a compressed or non-compressed file to be processed
      # - - name: compressed-uncompressed-file
      #     template: compressed-uncompressed-file

        # download tarball of data to be prepped for processing.
      - - name: download-tarball
          template: download-tarball
      
      - - name: extract
          template: extract
          arguments:
            artifacts:
              - name: exact-zip-file
                from: "{{steps.download-tarball.outputs.artifacts.zip-file}}"
      
    
  # # templates
  #   - name: compressed-uncompressed-file
  #     script:
        
    - name: download-tarball
      script:
        image: download-tarball:1.0.0
        command: ["/bin/sh", "-c"]
        source: |
          echo "Download tarball function"
          mkdir -p /var/run/argo/outputs/artifacts/tmp/
          wget https://maven-datasets.s3.amazonaws.com/Airbnb/Airbnb+Data.zip -O /var/run/argo/outputs/artifacts/tmp/Airbnb+Data.zip
      outputs:
        artifacts:
        - name: zip-file
          path: var/run/argo/outputs/artifacts/tmp/Airbnb+Data.zip
          archive:
            none: {}
    
    - name: extract
      inputs:
        artifacts:
          - name: exact-zip-file
            path: /var/run/argo/outputs/artifacts/tmp/Airbnb+Data.zip
      script:
        image: alpine:3.23.4
        command: ["/bin/sh", "-c"]
        source: |
          ls -al  /var/run/argo/outputs/artifacts/tmp/
          echo "unpacking zip bundle!"
          unzip /var/run/argo/outputs/artifacts/tmp/Airbnb+Data.zip -d /var/run/argo/outputs/artifacts/tmp/airbnb-data/